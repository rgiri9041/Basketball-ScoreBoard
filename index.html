<html>
    <head>
        <title>Basketball Score Board</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="score-box">
                <h2>HOME</h2>
                <div class="number-box">
                    <p id="home-score">0</p>
                </div>
                <div class="add-btn">
                    <button id="guestO">+1</button>
                    <button id="guestT">+2</button>
                    <button id="guestTh">+3</button>
                </div>
            </div>
            <div>
                <h2 class="score-box">GUEST</h2>
                <div class="number-box">
                    <p id="guest-score">0</p>
                </div>
                <div class="add-btn">
                    <button id="guestO">+1</button>
                    <button id="guestT">+2</button>
                    <button id="guestTh">+3</button>
                </div>
            </div>
        </div>
    </body>
</html>
